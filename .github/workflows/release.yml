name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Las tres plataformas construyen en paralelo y suben artifacts de workflow.
# Un único job final crea/actualiza el release de GitHub, sube todos los assets
# con `gh release upload --clobber` y lo publica. Así no hay drafts duplicados
# (GitHub permite varios drafts por el mismo tag si electron-builder publica en
# paralelo con releaseType=draft).
#
# electron-builder sigue generando latest-mac.yml / latest.yml / latest-linux.yml
# en dist/ con -p never; el job publish-release los sube junto a los binarios.
# El cask solo corre cuando el release público ya tiene el DMG.

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Como en windows: la caché va antes de `npm ci`, porque el binario de
      # Electron lo baja su postinstall.
      - name: Cache electron + electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-builder-mac-${{ hashFiles('package-lock.json') }}

      # postinstall recompila node-pty contra el ABI de Electron.
      # Con reintentos: es la misma descarga que tumbó windows en la v0.39.65 y
      # linux en la v0.39.63 y la v0.39.67.
      - name: Install deps
        shell: bash
        env:
          DEBUG: '@electron/get:*'
        run: |
          set -euo pipefail
          attempt=1
          max=3
          until npm ci; do
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::npm ci failed after ${max} attempts"
              exit 1
            fi
            echo "::warning::npm ci attempt ${attempt} failed; retrying in 20s"
            attempt=$((attempt + 1))
            sleep 20
          done

      - name: Write notary API key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY_CONTENT" > ~/private_keys/AuthKey.p8
          echo "APPLE_API_KEY=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Prepare release notes
        run: bash scripts/prepare-release.sh

      # Publica dmg (instalación manual) + zip (Squirrel.Mac / auto-update) +
      # latest-mac.yml en dist/. No publica a GitHub (-p never).
      - name: Build + sign + notarize
        env:
          # CSC_LINK acepta el .p12 en base64 directo, sin fichero intermedio.
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          # Los secrets vienen de Covenant, que es Tauri, y el nombre colisiona:
          # allí APPLE_API_KEY es el Key ID; en electron-builder es la RUTA al .p8
          # (la fija el paso anterior vía GITHUB_ENV) y el Key ID va aparte.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac-release -- -p never

      - name: Verify signature and notarization
        run: |
          set -euo pipefail
          APP="dist/mac-arm64/Covenant Gravity.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Falla si el ticket de notarización no está grapado en el bundle.
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/Covenant-Gravity-*-arm64.dmg
            dist/Covenant-Gravity-*-arm64.dmg.blockmap
            dist/Covenant-Gravity-*-arm64-mac.zip
            dist/Covenant-Gravity-*-arm64-mac.zip.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

  # Electron trae su propio runtime: a diferencia de Tauri no hacen falta
  # webkit2gtk ni ninguna dependencia de sistema. Linux no se firma.
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Como en windows: la caché va antes de `npm ci`, porque el binario de
      # Electron lo baja su postinstall.
      - name: Cache electron + electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-builder-linux-${{ hashFiles('package-lock.json') }}

      # ponytail: tercera copia del bucle de reintento (windows y Build tienen
      # la suya). Si aparece una cuarta, toca extraer una composite action.
      - name: Install deps
        shell: bash
        env:
          DEBUG: '@electron/get:*'
        run: |
          set -euo pipefail
          attempt=1
          max=3
          until npm ci; do
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::npm ci failed after ${max} attempts"
              exit 1
            fi
            echo "::warning::npm ci attempt ${attempt} failed; retrying in 20s"
            attempt=$((attempt + 1))
            sleep 20
          done

      - name: Prepare release notes
        run: bash scripts/prepare-release.sh

      # AppImage (auto-update vía latest-linux.yml) + deb. No publica a GitHub.
      - name: Build
        run: npm run dist:linux -- -p never

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/Covenant-Gravity-*.AppImage
            dist/Covenant-Gravity-*.deb
            dist/latest-linux.yml
          if-no-files-found: error

  # Sin firmar por ahora: el cert de code signing de SSL.com todavía no existe,
  # así que Windows mostrará el aviso de SmartScreen. Cuando llegue, se añade el
  # hook `win.sign` con los secrets de eSigner y este job no cambia.
  windows:
    # NO windows-latest: esa imagen ya es win25-vs2026, con Visual Studio 18, y
    # el @electron/node-gyp que usa electron-rebuild lo encuentra pero no sabe
    # parsear la versión ("unknown version undefined") y lo descarta. VS 2022
    # sí lo reconoce. Revisar al subir electron/electron-rebuild.
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Antes de `npm ci`, no después: el binario de Electron lo baja su
      # postinstall, así que restaurar la caché al terminar no evitaba nada.
      #
      # Las rutas van literales. `${{ env.LOCALAPPDATA }}` resolvía a vacío
      # —el contexto `env` solo tiene lo que declara el workflow, no las
      # variables del runner— y esto cacheaba `\electron\Cache`, que no existe.
      - name: Cache electron + electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('package-lock.json') }}

      # Aquí sí se recompila node-pty (a diferencia de `dist:win-portable`, que
      # lo salta para poder cross-buildear desde macOS y deja las terminales
      # muertas).
      #
      # Con reintentos, como el Build: el postinstall baja Electron de
      # github.com a pelo, y tres cortes de red seguidos dejaron el release
      # v0.39.65 sin publicar aunque macOS y Linux estaban en verde.
      # DEBUG=@electron/get imprime la URL y la causa real; sin eso el fallo
      # solo dice «TypeError: fetch failed».
      - name: Install deps
        shell: bash
        env:
          DEBUG: '@electron/get:*'
        run: |
          set -euo pipefail
          attempt=1
          max=3
          until npm ci; do
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::npm ci failed after ${max} attempts"
              exit 1
            fi
            echo "::warning::npm ci attempt ${attempt} failed; retrying in 20s"
            attempt=$((attempt + 1))
            sleep 20
          done

      - name: Prepare release notes
        shell: bash
        run: bash scripts/prepare-release.sh

      # NSIS + latest.yml. No publica a GitHub.
      # Retry cubre flakes TLS al bajar NSIS/electron-builder-binaries.
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          attempt=1
          max=3
          until npm run dist:win -- -p never; do
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::dist:win failed after ${max} attempts"
              exit 1
            fi
            echo "::warning::dist:win attempt ${attempt} failed; retrying in 15s"
            attempt=$((attempt + 1))
            sleep 15
          done

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/Covenant-Gravity-*-setup-*.exe
            dist/Covenant-Gravity-*-setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  # Un solo release: crea/actualiza el draft, sube todos los assets y publica.
  publish-release:
    needs: [macos, linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare release notes + GitHub draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CREATE_GITHUB_RELEASE: '1'
        run: bash scripts/prepare-release.sh

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Check every manifest has its binary
        run: |
          set -euo pipefail
          cd release-assets
          # Un latest*.yml sin su binario es el fallo silencioso del updater:
          # el cliente ve la versión, pide el archivo y recibe un 404. Pasó en
          # v0.39.37 con el .exe (el nombre en disco llevaba espacios y el glob
          # de artifacts no lo cogió), y el release salió igualmente en verde.
          missing=0
          for yml in latest*.yml; do
            while read -r asset; do
              [ -n "$asset" ] || continue
              if [ ! -f "$asset" ]; then
                echo "::error::$yml apunta a $asset y no está entre los assets"
                missing=1
              fi
            done < <(grep -E '^[[:space:]]+- url: ' "$yml" | sed 's/.*url: //' | tr -d '\r')
          done
          [ "$missing" -eq 0 ]

      - name: Upload assets and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ls -la release-assets
          # Sube todo lo generado por las tres plataformas (binarios + latest*.yml).
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber release-assets/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=true

  # Reusa el tap de Covenant. El cask se reescribe entero en cada release, así
  # que no hay que crearlo a mano: el primer tag lo genera.
  cask:
    needs: [publish-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT con Contents:write sobre karluiz/homebrew-covenant; GITHUB_TOKEN
          # no alcanza, el tap está fuera de esta org.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set; skipping cask update"; exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          DMG="Covenant-Gravity-${VERSION}-arm64.dmg"

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p "$DMG" -D dmg
          SHA=$(sha256sum "dmg/$DMG" | awk '{print $1}')

          TAP_DIR="$RUNNER_TEMP/homebrew-covenant"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/karluiz/homebrew-covenant.git" "$TAP_DIR"
          cat > "$TAP_DIR/Casks/covenant-gravity.rb" <<EOF
          cask "covenant-gravity" do
            version "${VERSION}"
            sha256 "${SHA}"

            url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/Covenant-Gravity-#{version}-arm64.dmg"
            name "Covenant Gravity"
            desc "Terminal como orquestador de agentes de IA"
            homepage "https://github.com/${GITHUB_REPOSITORY}"

            # Solo se publica arm64; sin esto un Mac Intel instalaría un binario
            # que no puede ejecutar.
            depends_on arch: :arm64

            app "Covenant Gravity.app"

            zap trash: [
              "~/Library/Application Support/Covenant Gravity",
              "~/Library/Preferences/com.covenant.gravity.plist",
              "~/Library/Caches/com.covenant.gravity",
              "~/Library/Logs/Covenant Gravity",
            ]
          end
          EOF
          cd "$TAP_DIR"
          git config user.name "covenant-release-bot"
          git config user.email "noreply@covenant.uno"
          git add Casks/covenant-gravity.rb
          git commit -m "covenant-gravity ${VERSION}"
          git push origin HEAD
