<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Covenant Gravity</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' https: blob: data:; connect-src http: https: ws: wss:" />
    <!--
      Splash: markup estático para el primer frame. Ambos CSS van como link
      bloqueante para que marca + masa Gravity pinten juntos (si Gravity.css
      solo llega con el bundle JS, se ven las letras y el logo aparece después).
      Vars de tema y reduce-motion salen de localStorage. Lo oculta splash.ts;
      Ajustes → Developer lo relanza.
    -->
    <script>
      try {
        var vars = JSON.parse(localStorage.getItem('splashThemeVars') || 'null')
        if (vars) {
          for (var key in vars) document.documentElement.style.setProperty(key, vars[key])
        }
        if (localStorage.getItem('splashReduceMotion') === 'true') {
          document.documentElement.setAttribute('data-reduce-motion', 'true')
        }
      } catch (e) { /* sin caché: defaults del tema oscuro */ }
    </script>
    <link rel="stylesheet" href="./renderer/components/GravityHeroCanvas.css" />
    <link rel="stylesheet" href="./renderer/agent/Gravity.css" />
  </head>
  <body>
    <div id="splash" class="gravity-hero-canvas">
      <div class="gravity gravity--hero" aria-hidden="true">
        <span class="gravity__core"></span>
        <span class="gravity__particle gravity__particle--1"></span>
        <span class="gravity__particle gravity__particle--2"></span>
        <span class="gravity__particle gravity__particle--3"></span>
        <span class="gravity__particle gravity__particle--4"></span>
        <span class="gravity__particle gravity__particle--5"></span>
        <span class="gravity__particle gravity__particle--6"></span>
        <span class="gravity__particle gravity__particle--7"></span>
        <span class="gravity__particle gravity__particle--8"></span>
        <span class="gravity__particle gravity__particle--9"></span>
        <span class="gravity__particle gravity__particle--10"></span>
        <span class="gravity__particle gravity__particle--11"></span>
      </div>
      <p class="gravity-hero-canvas__brand">COVENANT GRAVITY</p>
    </div>
    <div id="root"></div>
    <script type="module" src="./renderer/main.tsx"></script>
  </body>
</html>
